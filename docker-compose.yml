services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  api:
    build: .
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      DEMO_SUBSCRIBER_NO: ${DEMO_SUBSCRIBER_NO:-1001}
      DEMO_USERNAME: ${DEMO_USERNAME:-subscriber1001}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-change-me}
      DATABASE_URL: postgresql://billing:${POSTGRES_PASSWORD:-billing}@postgres:5432/billing
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  gateway:
    build: .
    command: ["npm", "run", "gateway"]
    environment:
      GATEWAY_PORT: 3001
      BILLING_API_BASE: http://api:3000
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  postgres_data:
